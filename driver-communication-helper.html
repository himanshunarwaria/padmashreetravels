<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<!-- FIX 13: removed maximum-scale=1.0 so tourists can pinch-zoom overlay text -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Driver Communication Helper – Padma Shree Travels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/logo.png">
<style>
/* ── Design tokens — matching padmashreetravels.in ──────── */
:root{
  --black:#0A0A0A; --white:#ffffff;
  --g900:#1A1A1A; --g800:#292929; --g700:#3D3D3D;
  --g600:#4F4F4F; --g500:#6B6B6B; --g400:#909090;
  --g300:#ADADAD; --g200:#D4D4D4; --g100:#EBEBEB; --g50:#F7F7F7;
  --gold:#B8943A; --gold-bg:rgba(184,148,58,.07); --gold-b:rgba(184,148,58,.35);
  --red:#D73B00;  --red-bg:rgba(215,59,0,.07);
  --green:#05944F; --teal:#0e7490;
  --teal-b:rgba(14,116,144,.32); --grn-b:rgba(5,148,79,.3);
  --ff:Inter,-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --r:10px; --r-lg:16px; --rp:999px;
  --sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --md:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --t:.18s ease;
  /* FIX 2: dynamic sticky heights set by JS on load + resize */
  --hdr-h: 56px;
  --tabs-h: 44px;
  --content-top: 100px; /* hdr + tabs */
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;
     /* FIX 16: push anchored targets below sticky chrome */
     scroll-padding-top:calc(var(--content-top) + 8px)}
body{font-family:var(--ff);font-size:16px;line-height:1.6;color:var(--g700);
     background:var(--white);overflow-x:hidden;
     -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
     /* FIX 6: iOS safe area support */
     padding-bottom:env(safe-area-inset-bottom)}

/* ── HEADER ──────────────────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:400;background:var(--white);
     border-bottom:1px solid var(--g100);box-shadow:var(--sm)}
.hdr__in{display:flex;align-items:center;justify-content:space-between;
         padding:.6rem 1rem;max-width:900px;margin:0 auto}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none}
.logo img{height:30px;width:auto;object-fit:contain}
.logo__t{font-size:.88rem;font-weight:700;color:var(--black);line-height:1.15}
.logo__t small{display:block;font-size:.52rem;font-weight:500;letter-spacing:.1em;
               text-transform:uppercase;color:var(--g400);margin-top:.1rem}
/* FIX 16: ARIA-labeled badge */
.hdr__badge{font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
            background:var(--gold-bg);border:1px solid var(--gold-b);color:var(--gold);
            padding:.28rem .72rem;border-radius:var(--rp);white-space:nowrap}

/* ── HERO STRIP (compact — FIX 4: no stats row) ─────────── */
.hero-strip{background:var(--black);padding:1rem 1rem .9rem;text-align:center}
.hero-strip h1{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;
               color:var(--white);margin-bottom:.2rem;line-height:1.25}
.hero-strip p{font-size:.72rem;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase}

/* ── GROUP TABS  (FIX 2: top set dynamically via --hdr-h) ── */
.group-tabs{display:flex;background:var(--white);border-bottom:1px solid var(--g100);
            padding:0 .5rem;overflow-x:auto;scrollbar-width:none;
            position:sticky;top:var(--hdr-h);z-index:300}
.group-tabs::-webkit-scrollbar{display:none}
.gtab{flex:1;min-width:80px;display:flex;flex-direction:column;align-items:center;
      gap:.2rem;padding:.75rem .5rem;border:none;background:transparent;
      color:var(--g400);font-size:.75rem;font-weight:600;font-family:var(--ff);
      white-space:nowrap;cursor:pointer;
      border-bottom:2px solid transparent;margin-bottom:-1px;
      transition:color var(--t),border-color var(--t);
      /* large touch target */
      min-height:52px}
.gtab.active{color:var(--black);border-bottom-color:var(--black)}
.gtab__icon{font-size:18px;line-height:1}/* FIX 20 icon bigger */

/* ── SEARCH ──────────────────────────────────────────────── */
.search-wrap{padding:.85rem 1rem .45rem;background:var(--white)}
.search-input{width:100%;padding:.8rem 1rem;
              border:1.5px solid var(--g200);border-radius:var(--rp);
              /* FIX 3: 16px prevents iOS auto-zoom */
              font-size:1rem;font-family:var(--ff);color:var(--black);background:var(--g50);
              outline:none;transition:border-color var(--t),box-shadow var(--t),background var(--t)}
.search-input:focus{border-color:var(--black);background:var(--white);
                    box-shadow:0 0 0 3px rgba(10,10,10,.06)}
.search-input::placeholder{color:var(--g300)}

/* ── RESULT COUNT (FIX 8) ────────────────────────────────── */
#result-count{display:none;padding:.3rem 1rem .1rem;
              font-size:.75rem;font-weight:600;color:var(--g400)}

/* ── CATEGORY PILLS + GRADIENT FADE (FIX 9) ──────────────── */
.cats-outer{position:relative;background:var(--white)}
/* gradient fade on right edge */
.cats-outer::after{content:'';position:absolute;top:0;right:0;bottom:0;width:3rem;
                   background:linear-gradient(to right,transparent,var(--white));
                   pointer-events:none;z-index:1}
.cats-wrap{padding:.4rem 1rem .7rem;display:flex;gap:.4rem;
           overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats-wrap::-webkit-scrollbar{display:none}
/* extra right padding so last pill clears the fade */
.cats-wrap::after{content:'';flex-shrink:0;width:2rem}
.cat-pill{flex-shrink:0;padding:.52rem 1rem;border-radius:var(--rp);
          border:1.5px solid var(--g200);background:var(--white);
          color:var(--g600);font-size:.78rem;font-weight:600;font-family:var(--ff);
          white-space:nowrap;cursor:pointer;transition:all var(--t);min-height:40px}
.cat-pill:hover{border-color:var(--g700);color:var(--black)}
.cat-pill.active{background:var(--black);color:var(--white);border-color:var(--black)}
/* FIX 10: phrase count shown in muted span inside pill */
.cat-pill .pill-count{opacity:.55;font-size:.7rem;font-weight:500;margin-left:.2rem}
.cat-pill.active .pill-count{opacity:.6}

/* ── MOST USED SECTION ───────────────────────────────────── */
#most-used{background:var(--g50);padding-bottom:.5rem}
.sec-label{display:flex;align-items:center;gap:.5rem;padding:.9rem 1rem .3rem}
.sec-badge{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
           background:var(--gold-bg);border:1px solid var(--gold-b);color:var(--gold);
           padding:.22rem .6rem;border-radius:var(--rp)}
.sec-title{font-size:.86rem;font-weight:700;color:var(--black)}
.sec-desc{font-size:.72rem;color:var(--g400);padding:0 1rem .55rem}
.grp-divider{height:1px;background:var(--g100);margin:.6rem 0 0}

/* ── CATEGORY HEADING (FIX 17: sticky within section) ────── */
.cat-heading{display:flex;align-items:center;gap:.5rem;
             padding:.9rem 1rem .3rem;
             position:sticky;top:var(--content-top);z-index:10;
             background:var(--white)}
.cat-heading__icon{width:28px;height:28px;border-radius:8px;
                   background:var(--g50);border:1px solid var(--g100);
                   display:flex;align-items:center;justify-content:center;
                   font-size:13px;flex-shrink:0}
.cat-heading__icon.loc{background:rgba(14,116,144,.08);border-color:var(--teal-b)}
.cat-heading__icon.emerg{background:var(--red-bg);border-color:rgba(215,59,0,.2)}
.cat-heading__icon.coord{background:rgba(5,148,79,.08);border-color:var(--grn-b)}
.cat-heading__name{font-size:.85rem;font-weight:700;color:var(--black)}
.cat-heading__line{flex:1;height:1px;background:var(--g100)}

/* ── PHRASE CARD (FIX 15: more breathing room) ───────────── */
.phrase-card{background:var(--white);border:1px solid var(--g100);
             border-left:3px solid var(--gold-b);border-radius:var(--r);
             /* FIX 15 */
             margin:.6rem 1rem;
             padding:1.1rem 1rem 1rem;
             transition:box-shadow var(--t),border-color var(--t)}
.phrase-card:hover{box-shadow:var(--md);border-color:var(--g200);border-left-color:var(--gold)}
.phrase-card.mu{background:var(--white);border-color:var(--g100);border-left-color:var(--gold-b)}
.phrase-card.emerg{border-left-color:rgba(215,59,0,.35)}
.phrase-card.emerg:hover{border-left-color:var(--red)}
.phrase-card.loc{border-left-color:var(--teal-b)}
.phrase-card.loc:hover{border-left-color:var(--teal)}
.phrase-card.coord{border-left-color:var(--grn-b)}
.phrase-card.coord:hover{border-left-color:var(--green)}

/* FIX 3: larger readable text */
.p-hindi{font-size:1.1rem;font-weight:600;color:var(--black);line-height:1.45;margin-bottom:.3rem}
.p-english{font-size:1rem;color:var(--g600);line-height:1.5;margin-bottom:.9rem}

/* ── CARD BUTTONS — 2-ROW LAYOUT (FIX 2) ────────────────── */
.card-btns{display:flex;flex-direction:column;gap:.4rem}
.card-btns-row{display:flex;gap:.4rem}
.cbtn{padding:.8rem .6rem;border-radius:var(--rp);border:none;
      /* FIX 3: button label bigger */
      font-size:.82rem;font-weight:600;font-family:var(--ff);
      cursor:pointer;text-align:center;white-space:nowrap;
      transition:background var(--t),box-shadow var(--t),transform var(--t);
      -webkit-user-select:none;user-select:none;
      min-height:48px;display:flex;align-items:center;justify-content:center;gap:.3rem}
.cbtn:active{transform:scale(.95)}
/* Row 1: copy buttons share the row equally */
.cbtn-en{flex:1;background:var(--black);color:var(--white)}
.cbtn-en:hover{background:var(--g800);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.cbtn-hi{flex:1;background:var(--white);color:var(--g700);border:1.5px solid var(--g200)}
.cbtn-hi:hover{border-color:var(--g700)}
/* Row 2: Show Tourist — full width, prominent gold */
.cbtn-show{width:100%;background:var(--gold);color:var(--white);font-size:.88rem}
.cbtn-show:hover{background:#a67e2a;box-shadow:0 4px 12px rgba(184,148,58,.28)}

/* ── EMERGENCY STICKY (FIX 6: safe-area-inset-bottom) ────── */
#emer-btn{position:fixed;
          bottom:calc(1.1rem + env(safe-area-inset-bottom));
          right:1rem;z-index:9000;
          background:var(--red);color:var(--white);
          border:none;border-radius:var(--rp);
          padding:.75rem 1.1rem;
          font-size:.82rem;font-weight:700;font-family:var(--ff);
          box-shadow:0 4px 18px rgba(215,59,0,.35);
          cursor:pointer;display:flex;align-items:center;gap:.4rem;
          transition:transform var(--t),box-shadow var(--t);min-height:48px}
#emer-btn:hover{background:#bf3400;box-shadow:0 6px 22px rgba(215,59,0,.42)}
#emer-btn:active{transform:scale(.95)}

/* ── BACK TO TOP FAB (FIX 7) ─────────────────────────────── */
#back-top{position:fixed;
          /* sits just above emergency button */
          bottom:calc(4.2rem + env(safe-area-inset-bottom));
          right:1rem;z-index:8999;
          width:40px;height:40px;border-radius:50%;
          background:var(--white);color:var(--g700);
          border:1.5px solid var(--g200);
          font-size:1rem;font-weight:700;font-family:var(--ff);
          box-shadow:var(--md);cursor:pointer;
          display:none;align-items:center;justify-content:center;
          transition:opacity var(--t),transform var(--t),box-shadow var(--t)}
#back-top.visible{display:flex}
#back-top:hover{border-color:var(--g700);color:var(--black);box-shadow:0 6px 20px rgba(0,0,0,.12)}
#back-top:active{transform:scale(.93)}

/* ── TOAST (FIX 6: safe-area + FIX 16: role=status) ─────── */
#toast{position:fixed;
       bottom:calc(5.8rem + env(safe-area-inset-bottom));
       left:50%;transform:translateX(-50%) translateY(8px);
       background:var(--g900);color:var(--white);
       padding:.6rem 1.4rem;border-radius:var(--rp);
       font-size:.8rem;font-weight:600;font-family:var(--ff);
       z-index:9500;opacity:0;pointer-events:none;
       transition:opacity .22s,transform .22s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── TOURIST OVERLAY ─────────────────────────────────────── */
#overlay{display:none;position:fixed;inset:0;
         background:var(--black);z-index:99999;
         flex-direction:column;align-items:center;justify-content:center;
         padding:2rem 1.5rem;text-align:center}
#overlay.on{display:flex}
#ov-close{position:absolute;top:calc(1rem + env(safe-area-inset-top));right:1rem;
          background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);
          color:var(--white);width:44px;height:44px;border-radius:50%;
          font-size:1.1rem;font-weight:600;cursor:pointer;
          display:flex;align-items:center;justify-content:center;
          font-family:var(--ff);transition:background var(--t)}
#ov-close:hover{background:rgba(255,255,255,.18)}
.ov-logo{display:flex;align-items:center;gap:.55rem;margin-bottom:1.8rem}
.ov-logo img{height:26px;opacity:.6}
.ov-logo-t{font-size:.68rem;font-weight:600;color:rgba(255,255,255,.4);
           letter-spacing:.12em;text-transform:uppercase}
.ov-rule{width:36px;height:1.5px;background:var(--gold);border-radius:2px;margin:0 auto 1.8rem}
#ov-en{font-size:clamp(1.65rem,7vw,3.4rem);font-weight:800;
       color:var(--white);line-height:1.25;letter-spacing:-.02em;margin-bottom:1.4rem}
#ov-hi{font-size:clamp(.95rem,3.8vw,1.55rem);color:rgba(255,255,255,.36);
       line-height:1.5;font-weight:500}
.ov-hint{position:absolute;bottom:calc(1.2rem + env(safe-area-inset-bottom));
         font-size:.65rem;color:rgba(255,255,255,.2);font-family:var(--ff)}

/* ── NO RESULTS ──────────────────────────────────────────── */
#no-results{display:none;text-align:center;padding:3rem 1rem;color:var(--g400)}
#no-results .nr-icon{font-size:2rem;margin-bottom:.6rem}
#no-results p{font-size:.9rem;font-weight:500}
#no-results small{font-size:.76rem;color:var(--g300);display:block;margin-top:.25rem}

.footer-space{height:6rem}
</style>
</head>
<body>

<!-- ── HEADER ────────────────────────────────────────────── -->
<header class="hdr" id="hdr">
  <div class="hdr__in">
    <a class="logo" href="/">
      <img src="images/logo.png" alt="Padma Shree Travels">
      <div class="logo__t">Padma Shree Travels<small>Agra Taxi Service</small></div>
    </a>
    <!-- FIX 16: aria-label on badge -->
    <span class="hdr__badge" aria-label="This is a private driver tool">Driver Tool</span>
  </div>
</header>

<!-- ── HERO STRIP (FIX 4: compact, no stats) ─────────────── -->
<div class="hero-strip">
  <h1>Driver Communication Helper</h1>
  <p>Hindi → English &nbsp;·&nbsp; Tourist के साथ आसान बातचीत</p>
</div>

<!-- ── GROUP TABS ─────────────────────────────────────────── -->
<div class="group-tabs" id="group-tabs" role="tablist">
  <button class="gtab active" onclick="setGroup('trip',this)" role="tab" aria-selected="true" aria-label="On Trip phrases">
    <span class="gtab__icon">🚗</span>On Trip
  </button>
  <button class="gtab" onclick="setGroup('location',this)" role="tab" aria-selected="false" aria-label="Location specific phrases">
    <span class="gtab__icon">📍</span>Locations
  </button>
  <button class="gtab" onclick="setGroup('collab',this)" role="tab" aria-selected="false" aria-label="Coordination phrases">
    <span class="gtab__icon">📞</span>Coordination
  </button>
</div>

<!-- ── EMERGENCY STICKY (FIX 6+16) ──────────────────────── -->
<button id="emer-btn" onclick="goEmergency()" aria-label="Go to emergency phrases">🚨 Emergency</button>

<!-- ── BACK TO TOP (FIX 7) ───────────────────────────────── -->
<button id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑</button>

<!-- ── TOAST (FIX 16: role=status) ──────────────────────── -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- ── TOURIST OVERLAY ───────────────────────────────────── -->
<div id="overlay" aria-modal="true" aria-label="Tourist display mode">
  <button id="ov-close" onclick="closeOverlay()" aria-label="Close tourist display">✕</button>
  <div class="ov-logo">
    <img src="images/logo.png" alt="Padma Shree Travels">
    <span class="ov-logo-t">Padma Shree Travels</span>
  </div>
  <div class="ov-rule"></div>
  <div id="ov-en"></div>
  <div id="ov-hi"></div>
  <div class="ov-hint">Tap ✕ to close</div>
</div>

<!-- ── SEARCH (FIX 14: shortened placeholder, autocorrect off) ── -->
<div class="search-wrap">
  <input id="search" class="search-input" type="search" inputmode="search"
    placeholder="🔍 Search: hotel, payment, doctor, Taj Mahal…"
    oninput="onSearch()" autocomplete="off" autocorrect="off"
    autocapitalize="off" spellcheck="false">
</div>

<!-- ── RESULT COUNT (FIX 8) ──────────────────────────────── -->
<div id="result-count" aria-live="polite"></div>

<!-- ── CATEGORY PILLS with gradient fade wrapper (FIX 9) ── -->
<div class="cats-outer">
  <div class="cats-wrap" id="cat-pills" role="group" aria-label="Filter by category"></div>
</div>

<!-- ── MAIN CONTENT ──────────────────────────────────────── -->
<div id="content"></div>
<div id="no-results">
  <div class="nr-icon">🔍</div>
  <p>No phrases found</p>
  <small>Search checks all tabs automatically</small>
</div>
<div class="footer-space"></div>

<script>
/* ============================================================
   DATA — all 35 categories, 300+ phrases
   ============================================================ */
const MOST_USED = [
  /* FIX 12: trimmed to 8 truly daily-use items */
  {h:"मैं आपका ड्राइवर हूँ।",                             e:"I am your driver."},
  {h:"कार यहीं खड़ी है, कृपया मेरे साथ आइए।",            e:"The car is parked here. Please come with me."},
  {h:"कृपया seat belt लगा लीजिए।",                        e:"Please wear your seat belt."},
  {h:"यहाँ से लगभग 20 मिनट लगेंगे।",                     e:"It will take around 20 minutes from here."},
  {h:"मैं यहीं आपका इंतज़ार कर रहा हूँ।",               e:"I am waiting for you here."},
  {h:"अगर ज़रूरत हो तो call कर दीजिए।",                  e:"Please call me if you need me."},
  {h:"आप cash, UPI या card से payment कर सकते हैं।",      e:"You can pay by cash, UPI, or card."},
  {h:"Padma Shree Travels चुनने के लिए धन्यवाद।",        e:"Thank you for choosing Padma Shree Travels."},
];

const CATS = [
/* ── ON TRIP ────────────────────────────────────────────── */
{id:"greeting",group:"trip",name:"Arrival / Greeting",icon:"🙏",phrases:[
  {h:"नमस्ते सर/मैडम, आपका स्वागत है।",                                             e:"Hello Sir/Madam, welcome."},
  {h:"मैं आपका ड्राइवर हूँ।",                                                        e:"I am your driver."},
  {h:"मेरी अंग्रेज़ी थोड़ी कमज़ोर है, लेकिन मैं पूरी मदद करूंगा।",                  e:"My English is limited, but I will help you fully."},
  {h:"आप चिंता मत कीजिए, मैं आपको सुरक्षित ले जाऊंगा।",                            e:"Please do not worry. I will take you safely and comfortably."},
  {h:"क्या आपकी यात्रा अच्छी रही?",                                                  e:"Was your journey comfortable?"},
  {h:"क्या आप पहली बार आगरा आए हैं?",                                                e:"Is this your first time in Agra?"},
  {h:"आपका आगरा में स्वागत है।",                                                      e:"Welcome to Agra."},
  {h:"क्या आप थके हुए हैं? पहले आराम करेंगे?",                                      e:"Are you tired? Would you like to rest first?"},
]},
{id:"pickup",group:"trip",name:"Pickup & Identity",icon:"🪪",phrases:[
  {h:"क्या आप [Customer Name] हैं?",                                                  e:"Are you [Customer Name]?"},
  {h:"क्या आपने Padma Shree Travels से cab book की है?",                              e:"Have you booked the cab with Padma Shree Travels?"},
  {h:"कृपया booking confirmation दिखा दीजिए।",                                         e:"Please show me the booking confirmation."},
  {h:"मैं आपकी cab लेकर आया हूँ।",                                                    e:"I have arrived with your cab."},
  {h:"कार यहीं खड़ी है, कृपया मेरे साथ आइए।",                                        e:"The car is parked here. Please come with me."},
  {h:"मैं आपका सामान कार तक ले चलता हूँ।",                                           e:"I will carry your luggage to the car."},
  {h:"यह मेरा नाम और number है, save कर लीजिए।",                                      e:"This is my name and number. Please save it."},
  {h:"क्या आपके साथ और कोई है जिसे pick करना है?",                                   e:"Is there anyone else we need to pick up?"},

  {h:"Tourist को early check-in की ज़रूरत है।",                                      e:"The tourist needs an early check-in."},
  {h:"क्या hotel से cab/auto arrange हो सकती है?",                                   e:"Can a cab or auto be arranged from the hotel?"},
]},
];

/* ============================================================
   STATE
   ============================================================ */
let activeGroup = 'trip';
let activeCat   = 'all';
let query       = '';

/* ============================================================
   STICKY POSITION UPDATER (FIX 2 — no hardcoded top:57px)
   ============================================================ */
function updateStickyPositions() {
  const hdr  = document.getElementById('hdr');
  const tabs = document.getElementById('group-tabs');
  const hH   = hdr  ? hdr.offsetHeight  : 56;
  const tH   = tabs ? tabs.offsetHeight : 44;
  const root = document.documentElement;
  root.style.setProperty('--hdr-h',       hH + 'px');
  root.style.setProperty('--tabs-h',       tH + 'px');
  root.style.setProperty('--content-top', (hH + tH) + 'px');
}

/* ============================================================
   BACK TO TOP (FIX 7)
   ============================================================ */
window.addEventListener('scroll', () => {
  const btn = document.getElementById('back-top');
  if (window.scrollY > 280) btn.classList.add('visible');
  else                        btn.classList.remove('visible');
}, { passive: true });

/* ============================================================
   HAPTIC FEEDBACK (FIX 11)
   ============================================================ */
function vibrate(ms = 8) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._to);
  t._to = setTimeout(() => t.classList.remove('show'), 2200);
}

function copyText(text, msg) {
  vibrate();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast(msg)).catch(() => fbCopy(text, msg));
  } else { fbCopy(text, msg); }
}

function fbCopy(text, msg) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch(e) { toast('Copy failed'); }
  document.body.removeChild(ta);
}

function showOverlay(en, hi) {
  vibrate(12);
  document.getElementById('ov-en').textContent = en;
  document.getElementById('ov-hi').textContent = hi;
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('on');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

/* ============================================================
   RESULT COUNT (FIX 8)
   ============================================================ */
function updateResultCount(total, q) {
  const rc = document.getElementById('result-count');
  if (q && total >= 0) {
    rc.textContent = total === 0
      ? 'No phrases found'
      : total + ' phrase' + (total === 1 ? '' : 's') + ' found';
    rc.style.display = 'block';
  } else {
    rc.style.display = 'none';
  }
}

/* ============================================================
   CARD BUILDER (FIX 2: 2-row button layout)
   ============================================================ */
function cardClass(catId, group) {
  if (catId === 'emergency') return 'emerg';
  if (group === 'location')  return 'loc';
  if (group === 'collab')    return 'coord';
  return '';
}

function makeCard(p, catId, group, muClass) {
  const d = document.createElement('div');
  d.className = 'phrase-card ' + (muClass || cardClass(catId, group));

  const ph = document.createElement('div'); ph.className = 'p-hindi';   ph.textContent = p.h;
  const pe = document.createElement('div'); pe.className = 'p-english'; pe.textContent = p.e;

  /* ── 2-row button layout ── */
  const btns = document.createElement('div'); btns.className = 'card-btns';

  /* Row 1: copy buttons */
  const row1 = document.createElement('div'); row1.className = 'card-btns-row';

  const bEn = document.createElement('button'); bEn.className = 'cbtn cbtn-en';
  bEn.innerHTML = '📋 Copy English';
  bEn.addEventListener('click', () => copyText(p.e, 'English copied ✓'));

  const bHi = document.createElement('button'); bHi.className = 'cbtn cbtn-hi';
  bHi.innerHTML = '📋 Copy Hindi';
  bHi.addEventListener('click', () => copyText(p.h, 'Hindi copied ✓'));

  row1.appendChild(bEn); row1.appendChild(bHi);

  /* Row 2: Show Tourist — full width */
  const bSh = document.createElement('button'); bSh.className = 'cbtn cbtn-show';
  bSh.innerHTML = '👁 Show to Tourist';
  bSh.addEventListener('click', () => showOverlay(p.e, p.h));

  btns.appendChild(row1); btns.appendChild(bSh);
  d.appendChild(ph); d.appendChild(pe); d.appendChild(btns);
  return d;
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  let total = 0;
  const q = query.toLowerCase();

  /* Most Used — trip tab, all cats, no search */
  if (activeGroup === 'trip' && activeCat === 'all' && !q) {
    const sec = document.createElement('div');
    sec.id = 'most-used';
    const lbl = document.createElement('div'); lbl.className = 'sec-label';
    const badge = document.createElement('span'); badge.className = 'sec-badge'; badge.textContent = 'Quick Lines';
    const title = document.createElement('span'); title.className = 'sec-title'; title.textContent = 'Most Used Phrases';
    lbl.appendChild(badge); lbl.appendChild(title); sec.appendChild(lbl);
    const desc = document.createElement('p'); desc.className = 'sec-desc';
    desc.textContent = 'Tap "Show to Tourist" to display full-screen English text';
    sec.appendChild(desc);
    MOST_USED.forEach(p => sec.appendChild(makeCard(p, 'most-used', 'trip', 'mu')));
    const div = document.createElement('div'); div.className = 'grp-divider'; sec.appendChild(div);
    content.appendChild(sec);
  }

  CATS.forEach(cat => {
    if (cat.group !== activeGroup) return;
    if (activeCat !== 'all' && cat.id !== activeCat) return;

    const matched = cat.phrases.filter(p => {
      if (!q) return true;
      return p.h.toLowerCase().includes(q) || p.e.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q);
    });
    if (!matched.length) return;
    total += matched.length;

    const grp = document.createElement('div');
    grp.id = 'cat-' + cat.id;

    /* Sticky category heading (FIX 17) */
    const hd = document.createElement('div'); hd.className = 'cat-heading';
    const ic = document.createElement('div');
    ic.className = 'cat-heading__icon'
      + (cat.id.startsWith('loc-') ? ' loc' : cat.group === 'collab' ? ' coord' : cat.id === 'emergency' ? ' emerg' : '');
    ic.textContent = cat.icon;
    const nm = document.createElement('span'); nm.className = 'cat-heading__name'; nm.textContent = cat.name;
    const ln = document.createElement('div'); ln.className = 'cat-heading__line';
    hd.appendChild(ic); hd.appendChild(nm); hd.appendChild(ln);
    grp.appendChild(hd);

    matched.forEach(p => grp.appendChild(makeCard(p, cat.id, cat.group)));
    content.appendChild(grp);
  });

  /* Cross-tab search fallback */
  if (!total && q) {
    CATS.forEach(cat => {
      if (cat.group === activeGroup) return;
      const matched = cat.phrases.filter(p =>
        p.h.toLowerCase().includes(q) || p.e.toLowerCase().includes(q)
      );
      if (!matched.length) return;
      total += matched.length;

      const grp = document.createElement('div'); grp.id = 'cat-' + cat.id;
      const hd = document.createElement('div'); hd.className = 'cat-heading';
      const ic = document.createElement('div');
      ic.className = 'cat-heading__icon'
        + (cat.group === 'location' ? ' loc' : cat.group === 'collab' ? ' coord' : '');
      ic.textContent = cat.icon;
      const nm = document.createElement('span'); nm.className = 'cat-heading__name'; nm.textContent = cat.name;
      const ln = document.createElement('div'); ln.className = 'cat-heading__line';
      hd.appendChild(ic); hd.appendChild(nm); hd.appendChild(ln);
      grp.appendChild(hd);
      matched.forEach(p => grp.appendChild(makeCard(p, cat.id, cat.group)));
      content.appendChild(grp);
    });
  }

  /* FIX 8: result count */
  updateResultCount(total, q);
  document.getElementById('no-results').style.display = (!total && q) ? 'block' : 'none';
}

/* ============================================================
   PILLS — with phrase counts + active pill scroll (FIX 9+10)
   ============================================================ */
function buildPills(group) {
  const wrap = document.getElementById('cat-pills');
  wrap.innerHTML = '';

  const all = document.createElement('button');
  all.className = 'cat-pill active';
  const totalAll = CATS.filter(c => c.group === group).reduce((s, c) => s + c.phrases.length, 0);
  all.innerHTML = 'All <span class="pill-count">· ' + totalAll + '</span>';
  all.addEventListener('click', () => setCat('all', all));
  wrap.appendChild(all);

  CATS.filter(c => c.group === group).forEach(cat => {
    const b = document.createElement('button');
    b.className = 'cat-pill';
    b.dataset.catId = cat.id;
    b.innerHTML = cat.icon + ' ' + cat.name + ' <span class="pill-count">· ' + cat.phrases.length + '</span>';
    b.addEventListener('click', () => setCat(cat.id, b));
    wrap.appendChild(b);
  });
}

function setCat(id, btn) {
  activeCat = id;
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
  if (btn) {
    btn.classList.add('active');
    /* FIX 9: scroll active pill into view */
    btn.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   GROUP TABS
   ============================================================ */
function setGroup(group, btn) {
  activeGroup = group;
  activeCat   = 'all';
  document.querySelectorAll('.gtab').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected', 'false');
  });
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-selected', 'true'); }
  buildPills(group);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   SEARCH (FIX 14)
   ============================================================ */
function onSearch() {
  query = document.getElementById('search').value.trim();
  render();
}

/* ============================================================
   EMERGENCY
   ============================================================ */
function goEmergency() {
  if (activeGroup !== 'trip') {
    setGroup('trip', document.querySelector('.gtab'));
  }
  setTimeout(() => {
    const el = document.getElementById('cat-emergency');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

/* ============================================================
   INIT
   ============================================================ */
buildPills('trip');
render();
updateStickyPositions();
/* Re-measure on resize (orientation change, keyboard open/close) */
window.addEventListener('resize', updateStickyPositions, { passive: true });
</script>
</body>
</html>
