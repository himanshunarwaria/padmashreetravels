<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: full bleed background, safe zone = inner 80% (center 409px) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A84A"/>
      <stop offset="100%" stop-color="#8a6c2a"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background (no rounded corners for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle top highlight -->
  <rect width="512" height="256" fill="white" fill-opacity="0.07"/>

  <!-- Safe zone content (centered, all within inner ~82%) -->
  <!-- PST — centered well within safe zone -->
  <text
    x="256" y="272"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="172"
    font-weight="900"
    letter-spacing="-4"
    fill="white">PST</text>

  <!-- Divider line -->
  <rect x="148" y="326" width="216" height="2.5" rx="1.25" fill="white" fill-opacity="0.35"/>

  <!-- DRIVER -->
  <text
    x="256" y="372"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Arial', sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="6"
    fill="white"
    fill-opacity="0.75">DRIVER</text>

  <text
    x="256" y="424"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Arial', sans-serif"
    font-size="32"
    font-weight="500"
    letter-spacing="8"
    fill="white"
    fill-opacity="0.45">HELPER</text>
</svg>
